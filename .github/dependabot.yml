version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 4
    schedule:
      interval: "weekly"
      timezone: "Europe/London"
      time: "09:00"
      day: "monday"
    commit-message:
      prefix: "ci:"
    groups:
      github-actions-updates:
        patterns:
          - "*"
